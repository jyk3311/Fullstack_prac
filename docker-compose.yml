services:
  db:
    image: postgres:16
    container_name: pipeline-db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pipeline-db-data:/var/lib/postgresql/data
    networks:
      - pipeline-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pipeline-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppass
    ports:
      - "8081:8081"
    depends_on:
      - db
    networks:
      - pipeline-network

  nginx:
    image: nginx:stable-alpine
    container_name: pipeline-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - pipeline-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pipeline-frontend
    ports:
      - "3000:80"
    networks:
      - pipeline-network
volumes:
  pipeline-db-data:

networks:
  pipeline-network: